id: decision
name: Decision
description: Turns rule results into Auto-approve / Needs review / On hold / Reject (code) and writes a buyer-friendly explanation (LLM, cannot change the decision).
kind: hybrid
enabled: true
handler: app.agents.decision:DecisionAgent
actions:
  decide:
    outcomes: [auto_approve, needs_review, on_hold, reject]
    prompt: prompts/decision_explainer.md
model:
  reasoning_effort: low
  max_output_tokens: 2000
params:
  # highest failed rule severity (rules.yaml decision_precedence) -> outcome; nothing failed + all gates pass -> pass_outcome
  severity_outcomes: { reject: reject, hold: on_hold, review: needs_review }
  pass_outcome: auto_approve
  gate_failure_outcome: needs_review
  reserve_po_balance_on: [auto_approve, needs_review]
  explanation_max_sentences: 4
  # the summary's first sentence is "<label>: <top reason>." built in code; the LLM writes only what follows
  decision_labels: { auto_approve: Auto-approved, needs_review: Needs review, on_hold: On hold, reject: Rejected }
  # phrases that state a decision: LLM detail that uses another decision's phrases is replaced by the rule explanations
  decision_terms:
    auto_approve: [auto-approv, auto approv, approved automatically]
    needs_review: [needs review, needs a review, sent for review, sent to review]
    on_hold: [on hold]
    reject: [rejected, we reject]
retries: 1
timeout_s: 60
