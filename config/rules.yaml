# Procurement policy. Deterministic: evaluated in code by backend/app/rules/engine.py.
# severity on failure: reject > hold > review > info (info never blocks auto-approve)
# explain: Jinja2 template rendered with the rule's evidence dict -> shown to reviewers verbatim.
# highlight: review-grid cells a failure marks amber (invoice fields, lines.<field> on the lines in the evidence,
#            po, vendor, or evidence:<key> = a list of field names in the evidence).

currency: USD
decision_precedence: [reject, hold, review]

auto_approve_gates:
  min_extraction_confidence: 0.90     # every required field >= this
  max_amount: 25000                   # invoice total above this always goes to review
  require_explicit_po: true           # implied PO match can never auto-approve
  require_approved_vendor: true

rules:
  - id: required_fields
    name: Required fields present
    fail_label: "Missing required fields"
    enabled: true
    applies_to: all
    severity: hold
    highlight: [evidence:missing]
    params: { fields: [invoice_number, invoice_date, total, vendor_name] }
    explain: "Missing {{ missing | join(', ') }}. We need these before the invoice can be processed."

  - id: document_classification
    name: Document recognised as an invoice
    fail_label: "Unsure this is an invoice"
    enabled: true
    applies_to: all
    severity: review
    params: {}
    explain: "The classifier was only {{ confidence }} sure {{ filename }} is an {{ label | replace('_', ' ') }} (threshold {{ min_confidence }}). Please confirm the document type and the extracted fields."

  - id: low_confidence_fields
    name: Extraction confidence
    fail_label: "Low extraction confidence"
    enabled: true
    applies_to: all
    severity: review
    highlight: [evidence:fields]
    params: { min_confidence: 0.60 }
    explain: "Low read confidence on {{ fields | join(', ') }}; please confirm against the document."

  - id: arithmetic
    name: Lines, tax and total add up
    fail_label: "Totals don't add up"
    enabled: true
    applies_to: all
    severity: review
    highlight: [subtotal, tax_total, total, lines.amount]
    params: { abs_tolerance: 0.05 }
    explain: "Lines {{ lines_sum }} + tax {{ tax }} + shipping {{ shipping }} = {{ computed }}, but the invoice total is {{ total }}."

  - id: duplicate_exact
    name: Not a duplicate
    fail_label: "Duplicate invoice"
    enabled: true
    applies_to: all
    severity: reject
    highlight: [invoice_number, total]
    params: {}
    explain: "Same vendor, invoice number {{ number }} and amount {{ amount }} as {{ other_ref }} (received {{ other_date }})."

  - id: duplicate_near
    name: Not a possible duplicate
    fail_label: "Possible duplicate"
    enabled: true
    applies_to: all
    severity: review
    highlight: [invoice_number, total]
    params: { window_days: 30 }
    explain: "Same vendor and amount {{ amount }} as {{ other_ref }} within {{ days }} days, with a different invoice number."

  - id: vendor_approved
    name: Vendor is approved
    fail_label: "Vendor not approved"
    enabled: true
    applies_to: all
    severity: hold
    highlight: [vendor]
    params: {}
    explain: "{{ vendor_name }} is {{ status }} in the vendor master."

  - id: bank_details_match
    name: Bank details match vendor master
    fail_label: "Bank details changed"
    enabled: true
    applies_to: all
    severity: hold
    highlight: [vendor]
    params: {}
    explain: "Invoice asks for payment to account ending {{ invoice_last4 }}, but the vendor master has {{ master_last4 }}. Changed bank details are a common payment-fraud pattern; we need a signed bank letter."

  - id: po_valid
    name: PO exists, is open and belongs to vendor
    fail_label: "Invalid PO reference"
    enabled: true
    applies_to: po
    severity: review
    highlight: [po]
    params: {}
    explain: "{{ reason }}"

  - id: implied_po_requires_review
    name: PO was inferred, not quoted
    fail_label: "PO inferred, not quoted"
    enabled: true
    applies_to: po
    severity: review
    highlight: [po]
    params: { min_score: 0.85 }
    explain: "No PO number on the invoice. Best match is {{ po_number }} (score {{ score }}); please confirm."

  - id: price_tolerance
    name: Unit prices within tolerance
    fail_label: "Unit price over PO"
    enabled: true
    applies_to: po
    severity: review
    highlight: [lines.unit_price, lines.amount]
    params: { pct: 2.0, abs: 50.0, mode: both_must_exceed }   # both_must_exceed | either_exceeds
    explain: "{{ line_desc }}: invoiced {{ inv_price }} vs PO {{ po_price }} ({{ pct }}%, {{ abs_diff }} per unit). Tolerance {{ tol_pct }}% / {{ tol_abs }}."

  - id: quantity_vs_grn
    name: Quantity not above goods received
    fail_label: "Qty above goods received"
    enabled: true
    applies_to: po
    severity: review
    highlight: [lines.qty]
    params: {}
    explain: "{{ line_desc }}: invoiced qty {{ inv_qty }} but only {{ grn_qty }} received."

  - id: po_balance
    name: Within remaining PO balance
    fail_label: "Over PO balance"
    enabled: true
    applies_to: po
    severity: review
    highlight: [po, subtotal]
    params: { pct: 2.0 }
    explain: "Invoice subtotal {{ amount }} vs PO {{ po_number }} remaining {{ remaining }} (already invoiced {{ consumed }} of {{ po_amount }}): over by {{ over_pct }}%, tolerance {{ tol_pct }}%."

  - id: unmatched_lines
    name: All lines map to the PO
    fail_label: "Lines not on the PO"
    enabled: true
    applies_to: po
    severity: review
    highlight: [lines.description, lines.gl_code]
    params: {}
    explain: "Lines not on {{ po_number }}: {{ lines | join('; ') }}."

  - id: non_po_requires_review
    name: Non-PO invoice needs budget-owner approval
    fail_label: "Non-PO invoice"
    enabled: true
    applies_to: non_po
    severity: review
    highlight: [lines.gl_code]
    params: {}
    explain: "No PO found. Suggested coding {{ gl_code }} {{ gl_name }}; route to budget owner."

  - id: currency_match
    name: Currency matches PO
    fail_label: "Currency mismatch"
    enabled: true
    applies_to: po
    severity: review
    highlight: [currency]
    params: {}
    explain: "Invoice in {{ inv_currency }}, PO in {{ po_currency }}."

  - id: date_sanity
    name: Invoice date is plausible
    fail_label: "Implausible invoice date"
    enabled: true
    applies_to: all
    severity: review
    highlight: [invoice_date]
    params: { max_future_days: 3, max_age_days: 365 }
    explain: "Invoice date {{ date }} is {{ reason }}."

  - id: tax_rate_valid
    name: Tax rate is an allowed rate
    fail_label: "Invalid tax rate"
    enabled: true
    applies_to: all
    severity: review
    highlight: [tax_total, lines.tax_amount]
    params: { allowed_rates_pct: [0, 5, 6.25, 7.25, 8.25, 10, 20], rounding_tolerance: 0.01 }   # tax may differ from subtotal x rate by cent rounding
    explain: "Tax rate {{ rate }}% is not an allowed rate."
